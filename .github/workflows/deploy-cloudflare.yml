name: Deploy to Cloudflare

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leveldev-net-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, verify, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out master
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify rendered pages
        run: node --test tests/rendered-html.test.mjs

      - name: Deploy to Cloudflare Workers
        run: >
          npx wrangler deploy
          --config dist/server/wrangler.json
          --name leveldev-net
          --domain leveldev.net
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Allow AI search and user-requested crawlers
        shell: bash
        run: |
          response="$(
            curl --silent --show-error \
              --request PUT \
              --url "https://api.cloudflare.com/client/v4/zones/d9eb0f8192c6b69f0d813459c80efa8c/bot_management" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"ai_bots_protection":"disabled","is_robots_txt_managed":false}'
          )"

          echo "${response}" | node --input-type=module -e '
            let input = "";
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              const payload = JSON.parse(input);
              if (
                payload.success !== true ||
                payload.result?.ai_bots_protection !== "disabled" ||
                payload.result?.is_robots_txt_managed !== false
              ) {
                console.error(JSON.stringify(payload.errors ?? payload, null, 2));
                process.exit(1);
              }
              console.log("Cloudflare AI crawler access policy is configured.");
            });
          '
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
